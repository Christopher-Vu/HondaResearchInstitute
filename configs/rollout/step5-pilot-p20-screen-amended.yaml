# P20's screen as amended on 2026-11-04, before any outcome was read: three pairs that ended before their hazard are cut again
# past it, under new base ids. Protocol: docs/research/experiments/h13-cross-family-gap/protocol.md
# Routes and manifest are written from the original screen's files, which stay as locked:
#   PYTHONPATH=adapters/simlingo python docs/research/experiments/h13-cross-family-gap/recut_pairs.py
# The new pairs drive one pair per A40, so both arms share a node:
#   ROUTE_IDS="<slice> <neighbourhood> ..." bash scripts/submit.sh gpu_a40 --time=0-03:00:00 --array=0-2 scripts/route_sample.sbatch configs/rollout/step5-pilot-p20-screen-amended.yaml 2
# Scored with every job that drove its routes; the scorer keeps a route's first driving outcome.
# Captures every layer's frame means plus layers 10 and 11's driving-query tokens (the per-token SAE input).

name: step5-pilot-p20-screen-amended
step: 5
scope: savio_step5_pilot_p20_screen_amended

policy:
  name: simlingo
  ckpt_sha256: ec8943723d266ee9f5f56f45d153a163b22616960bfccb741965ea5daa700d28
  cot: false
  device: cuda                   # bfloat16 on CUDA via runtime-compatibility.patch

simulator:
  carla_version: "0.9.15"
  carla_build: stock-linux-release
  bench2drive_version: "0.0.3"
  quality: Epic                  # matches Steps 1, 2 and 4
  timeout_seconds: 600           # Bench2Drive's default, as in Step 4

capture_every: 10
capture_token_layers: [10, 11]   # Step 4 closed on layers 10 and 11

route:
  seed: 25                       # traffic manager seed; unused by every earlier pilot
  routes_file: configs/rollout/step5-pilot-p20-screen-amended.xml
  manifest: configs/rollout/step5-pilot-p20-screen-amended.manifest.json   # the route list; this config has no `routes` key

pilot:
  base_routes_file: configs/rollout/step5-pilot-p20-screen-bases.xml
  practice_gaps: gaps/practice/practice_v3.yaml
  gap_id: P20_oncoming_hidden
  generator_seed: 38
  stage: screen
  screen_base_routes: 10
  id_offset: 9                   # route ids end in 39 and 49
  cut_routes:
    bench2drive: .runtime/simlingo/leaderboard/data/bench2drive220.xml
    from: [.runtime/simlingo/leaderboard/data/routes_validation.xml, .runtime/simlingo/leaderboard/data/routes_training.xml]
    excluded_bases: []
    first_id: 64000                # distinct from every other cut file: a base id names one road
    lead_m: 20
    tail_m: 60
    min_spacing_m: 100
    min_length_m: 100
    max_length_m: 800
  # Bench2Drive skipped these scenarios' authored scenario in Step 2, which summarize() rejects (as in Step 4).
  exclude_scenarios: [InterurbanActorFlow, InterurbanAdvancedActorFlow]
