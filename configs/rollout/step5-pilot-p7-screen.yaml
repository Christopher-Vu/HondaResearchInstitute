# Step 5 efficacy pilot for practice gap P7, camera freeze (the policy's frame stalls for 2 s of every 3 s from 2 s in), gaps/practice/practice_v2.yaml.
# Screen: 10 pairs; the full pilot runs only if its screen_rule holds.
# Routes and manifest are generated, not written:
#   python adapters/simlingo/pilot_routes.py configs/rollout/step5-pilot-p7-screen.yaml
# Two routes per A40, in route_run.run_order's shuffle:
#   bash scripts/submit.sh gpu_a40 --time=0-03:00:00 --array=0-9%6 scripts/route_sample.sbatch configs/rollout/step5-pilot-p7-screen.yaml 2
# Captures every layer's frame means plus layers 10 and 11's driving-query tokens (the per-token SAE input).

name: step5-pilot-p7-screen
step: 5
scope: savio_step5_pilot_p7_screen

policy:
  name: simlingo
  ckpt_sha256: ec8943723d266ee9f5f56f45d153a163b22616960bfccb741965ea5daa700d28
  cot: false
  device: cuda                   # bfloat16 on CUDA via runtime-compatibility.patch

simulator:
  carla_version: "0.9.15"
  carla_build: stock-linux-release
  bench2drive_version: "0.0.3"
  quality: Epic                  # matches Steps 1, 2 and 4
  timeout_seconds: 600           # Bench2Drive's default, as in Step 4

capture_every: 10
capture_token_layers: [10, 11]   # Step 4 closed on layers 10 and 11

route:
  seed: 7                        # traffic manager seed; P3-P6 used 2, 4, 5, 6
  routes_file: configs/rollout/step5-pilot-p7-screen.xml
  manifest: configs/rollout/step5-pilot-p7-screen.manifest.json   # the route list; this config has no `routes` key

pilot:
  base_routes_file: .runtime/simlingo/leaderboard/data/bench2drive220.xml
  practice_gaps: gaps/practice/practice_v2.yaml
  gap_id: P7_camera_freeze
  generator_seed: 4
  stage: screen
  screen_base_routes: 10
  id_offset: 8                   # route ids end in 38 and 48; P3 uses 30 and 40
  # Bench2Drive skipped these scenarios' authored scenario in Step 2, which summarize() rejects (as in Step 4).
  exclude_scenarios: [InterurbanActorFlow, InterurbanAdvancedActorFlow]
