# Background wave 3 with per-token capture (CONFLICTS.md C21, approved by Jerry 2026-10-30; the H1 Tier 2 corpus in
# docs/research/experiments/h1-planted-gap-recovery/protocol.md): 200 Bench2Drive-220 base routes, each under one
# stock preset, as wave 2, but capturing layers 10 and 11's driving-query tokens so the per-token SAE can read the
# background as it reads the P4, P7 and P8 pilots. Ids offset by 60 (role background_wave3).
# Routes and manifest are generated, not written:
#   python adapters/simlingo/dev_routes.py configs/rollout/step5-background-wave3.yaml
#   bash scripts/submit.sh gpu_a40 --time=0-03:00:00 --array=0-99%6 scripts/route_sample.sbatch configs/rollout/step5-background-wave3.yaml 2

name: step5-background-wave3
step: 5
scope: savio_step5_background_wave3

policy:
  name: simlingo
  ckpt_sha256: ec8943723d266ee9f5f56f45d153a163b22616960bfccb741965ea5daa700d28
  cot: false
  device: cuda                   # bfloat16 on CUDA via runtime-compatibility.patch

simulator:
  carla_version: "0.9.15"
  carla_build: stock-linux-release
  bench2drive_version: "0.0.3"
  quality: Epic                  # matches Steps 1 and 2
  timeout_seconds: 600           # Bench2Drive's default; one Step 2 route lost its setup to 60 s

# Per-layer residual means every step and exact model inputs every 10th step (capture_agent.py).
capture_every: 10
capture_token_layers: [10, 11]   # Step 4 closed on layers 10 and 11

route:
  seed: 10                       # traffic manager seed; Step 2 used 0, waves 1-2 used 1 and 3, pilots P3-P9 2 and 4-9
  routes_file: configs/rollout/step5-background-wave3.xml
  manifest: configs/rollout/step5-background-wave3.manifest.json   # the route list; this config has no `routes` key

dev_pool:
  base_routes_file: .runtime/simlingo/leaderboard/data/bench2drive220.xml
  practice_gaps: gaps/practice/practice_v1.yaml
  generator_seed: 2
  background_only: true          # no practice-gap slices or neighbourhoods
  background_role: background_wave3
  background: 200                # of the 205 eligible base routes, each under one stock preset
  # Step 2's Bench2Drive skipped these scenarios' authored scenario in 7 routes, which summarize() rejects:
  # all 5 InterurbanActorFlow routes and 2 of the 5 InterurbanAdvancedActorFlow routes (23700, 24078).
  exclude_scenarios: [InterurbanActorFlow, InterurbanAdvancedActorFlow]
