# Step 5 efficacy pilot for practice gap P14, fast traffic to join, gaps/practice/practice_v3.yaml.
# Full pilot, after its screen passed (H7) and PDM-Lite drove it (H8). Protocol: docs/research/experiments/h9-p14-full-pilot/protocol.md
# Routes and manifest are generated, not written:
#   python adapters/simlingo/cut_routes.py configs/rollout/step5-pilot-p14-main.yaml
#   python adapters/simlingo/pilot_routes.py configs/rollout/step5-pilot-p14-main.yaml
# Three routes per A40, in route_run.run_order's shuffle:
#   bash scripts/submit.sh gpu_a40 --time=0-03:00:00 --array=0-39%6 scripts/route_sample.sbatch configs/rollout/step5-pilot-p14-main.yaml 3
# Captures every layer's frame means plus layers 10 and 11's driving-query tokens (the per-token SAE input).

name: step5-pilot-p14-main
step: 5
scope: savio_step5_pilot_p14_main

policy:
  name: simlingo
  ckpt_sha256: ec8943723d266ee9f5f56f45d153a163b22616960bfccb741965ea5daa700d28
  cot: false
  device: cuda                   # bfloat16 on CUDA via runtime-compatibility.patch

simulator:
  carla_version: "0.9.15"
  carla_build: stock-linux-release
  bench2drive_version: "0.0.3"
  quality: Epic                  # matches Steps 1, 2 and 4
  timeout_seconds: 600           # Bench2Drive's default, as in Step 4

capture_every: 10
capture_token_layers: [10, 11]   # Step 4 closed on layers 10 and 11

route:
  seed: 20                       # traffic manager seed; unused by every earlier pilot
  routes_file: configs/rollout/step5-pilot-p14-main.xml
  manifest: configs/rollout/step5-pilot-p14-main.manifest.json   # the route list; this config has no `routes` key

pilot:
  base_routes_file: configs/rollout/step5-pilot-p14-main-bases.xml
  practice_gaps: gaps/practice/practice_v3.yaml
  gap_id: P14_fast_flow_join
  generator_seed: 33
  base_routes: 60
  cut_routes:
    bench2drive: .runtime/simlingo/leaderboard/data/bench2drive220.xml
    from: [.runtime/simlingo/leaderboard/data/routes_validation.xml, .runtime/simlingo/leaderboard/data/routes_training.xml]
    excluded_bases: [11715, 11755, 2050, 2201, 26394, 26956, 26966, 27506, 3676, 4937]   # P14's screen
    first_id: 60000
    lead_m: 20
    tail_m: 60
    min_spacing_m: 100
    min_length_m: 100
    max_length_m: 500            # a longer route costs compute without meeting more of the gap
  id_offset: 47                  # route ids end in 77 and 87, not the screen's 74 and 84
  # Bench2Drive skipped these scenarios' authored scenario in Step 2, which summarize() rejects (as in Step 4).
  exclude_scenarios: [InterurbanActorFlow, InterurbanAdvancedActorFlow]
