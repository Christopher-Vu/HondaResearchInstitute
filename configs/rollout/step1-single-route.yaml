# Step 1 — smallest possible SimLingo rollout.
# One route, one seed, CoT off. See docs/steps/01-smallest-rollout.md
# Run by scripts/step1.sbatch through adapters/simlingo/run_savio.py.
#
# Fields marked TBD-STEP1 are what this step measures or discovers.
# Do not guess them; fill them from results/savio/<job>/route/readiness.json
# and commit the result.

name: step1-single-route
step: 1
scope: savio_step1_single_route

policy:
  name: simlingo
  hf_repo: RenzKa/simlingo
  ckpt_sha256: ec8943723d266ee9f5f56f45d153a163b22616960bfccb741965ea5daa700d28        # verified against publisher SHA256
  cot: false                     # PRD 10.1 / D4 — commentary and CoT off
  device: cuda                   # bfloat16 on CUDA via runtime-compatibility.patch
  # Read these off the loaded config, do not trust the defaults below.
  # PRD 16.11. Every storage estimate in 12.1 and the SAE width in 12.2
  # scale with hidden_size.
  arch:
    hidden_size: 896       # read from strict-loaded model
    num_decoder_layers: 24 # read from strict-loaded model
    query_token_module: adaptors.driving # query_embeds_wps / query_embeds_speed; Step 3 hook site

simulator:
  carla_version: "0.9.15"
  carla_build: stock-linux-release   # official CARLA_0.9.15.tar.gz, not the Fail2Drive build
  bench2drive_version: "0.0.3" # v0.0.3 and v0.0.4 are NOT comparable
  mode: synchronous
  fixed_delta_seconds: 0.05
  render_offscreen: true         # PRD 1.2 — the most likely blocker
  quality: Epic                  # matches the Mac run
  timeout_seconds: 60

route:
  # The route the Mac run completed (results/local-mac/20261002-182756), so the
  # first Savio result can be compared with a known-good one. Town05 ships in
  # the base CARLA package.
  id: "26956"
  town: Town05
  scenario: SignalizedJunctionRightTurn
  seed: 0

measure:
  # Measured 2026-10-08, Savio job 39732394 on one A40 (savio3_gpu, n0214, 8 CPUs), bfloat16.
  # Evidence: results/savio/39732394/route/readiness.json. Route completed, score 100,
  # 299 model steps, only the unpenalized minimum-speed checks.
  wall_clock_seconds: 210.4      # Bench2Drive duration_system; whole job 9 min 43 s
  simulated_seconds: 15.0
  real_time_factor: 0.0713       # Mac M5 Pro: 0.0601 on the same route
  peak_vram_gb: 9.41             # whole stack, including the CARLA server
  mean_gpu_utilization_percent: 15.6  # whole route stage; about 42% while driving
  service_units: 4.75            # check_usage.sh before and after; 3.67 SU per CPU-hour

outputs:
  results_dir: results/savio/
  record_infractions: true
