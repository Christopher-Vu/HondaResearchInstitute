# Fail2Drive track step F1 (docs/prd-fail2drive.md): screen Fail2Drive's other 14 scenario types, every pair, one seed.
# Completes the per-type picture begun by f2d-repro-screen.yaml (PedestriansOnRoad, Wall, CustomObstacles); the
# paper gives no per-scenario SimLingo table, so the gap selection rule (step F2) reads these numbers.
# Each Fail2Drive pair is one base: generalization route = slice, its base twin = neighbourhood (fail2drive_pairs.py).
# Public: Fail2Drive's routes and assets never enter the sealed key, and Fail2Drive forbids training on them.
#   python adapters/simlingo/fail2drive_pairs.py configs/rollout/f2d-screen-full.yaml Animals BadParking \
#     ConstructionPedestrian ConstructionPermutations FullyBlocked HardBrake ImageOnObject ObscuredStop \
#     OppositeConstruction PassableObstacles PedestrianCrowd PedestrianOtherBlocker RightConstruction RightOfWay
#   80 pairs, 160 routes, 3 per A40: --array=0-53, about 560 SU (estimate, 3.5 SU a route measured on 40883276).

name: f2d-screen-full
step: F1
scope: savio_f2d_screen_full

policy:
  name: simlingo
  ckpt_sha256: ec8943723d266ee9f5f56f45d153a163b22616960bfccb741965ea5daa700d28
  cot: false
  device: cuda                   # bfloat16 on CUDA via runtime-compatibility.patch

simulator:
  carla_version: "0.9.15"
  carla_build: fail2drive        # Fail2Drive's server, for its novel assets (configs/cluster/savio.yaml)
  benchmark: fail2drive          # its leaderboard and scenario runner, pinned in route_run.FAIL2DRIVE_REVISION
  debug_level: 0
  quality: Epic
  timeout_seconds: 600

capture_every: 10
capture_token_layers: [10, 11]

route:
  seed: 24                       # same as f2d-repro-screen.yaml, so the two screens read as one
  routes_file: configs/rollout/f2d-screen-full.xml
  manifest: configs/rollout/f2d-screen-full.manifest.json   # the route list; this config has no `routes` key
