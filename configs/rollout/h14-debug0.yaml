# H14 (without route markers, the evaluator's default): docs/research/experiments/h14-route-markers/protocol.md. Copies step2-bench2drive220.yaml and differs from
# the other arm only in name, scope and simulator.debug_level. Routes are the protocol's draw in order: 80 for Stage 1, then 133.
# The submit commands are in the protocol's "Submit" section.

name: h14-debug0
step: 14
scope: savio_h14_debug0

policy:
  name: simlingo
  ckpt_sha256: ec8943723d266ee9f5f56f45d153a163b22616960bfccb741965ea5daa700d28
  cot: false
  device: cuda                   # bfloat16 on CUDA via runtime-compatibility.patch

simulator:
  carla_version: "0.9.15"
  carla_build: stock-linux-release
  bench2drive_version: "0.0.3"
  quality: Epic                  # matches Step 2
  timeout_seconds: 600           # Bench2Drive's default; one Step 2 route lost its setup to 60 s
  debug_level: 0                 # the evaluator's default: no markers

# Per-layer residual means every step and exact model inputs every 10th step (capture_agent.py), as Step 2.
capture_every: 10

