# Step 4 ablation, layer-11 per-token arm (docs/steps/04-layer-site-ablation.md): 60 Step 2 rerun routes
# (random.Random(1).sample of its 212 scored routes) rerun with driving-query tokens at layers 10, 11 and 14, so
# per-token analyses can compare 11 with 10 and 14 on the same rollouts. Otherwise identical to step2-rerun.yaml.
#   bash scripts/submit.sh gpu_a40 --time=0-03:00:00 --array=0-29%6 scripts/route_sample.sbatch configs/rollout/step4-tokens-l11.yaml 2

name: step4-tokens-l11
step: 4
scope: savio_step4_tokens_l11

policy:
  name: simlingo
  ckpt_sha256: ec8943723d266ee9f5f56f45d153a163b22616960bfccb741965ea5daa700d28
  cot: false
  device: cuda                   # bfloat16 on CUDA via runtime-compatibility.patch

simulator:
  carla_version: "0.9.15"
  carla_build: stock-linux-release
  bench2drive_version: "0.0.3"
  quality: Epic                  # matches Step 1 and the Mac runs
  timeout_seconds: 60

# Per-layer residual means every step and exact model inputs every 10th step (capture_agent.py),
# as the Mac sweep recorded, so Steps 3-4 can use these rollouts without rerunning them.
capture_every: 10
capture_token_layers: [10, 11, 14]   # layer 11 added: the Step 4 ablation's recommended arm

route:
  seed: 0

