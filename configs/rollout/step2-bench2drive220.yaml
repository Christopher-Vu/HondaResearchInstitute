# Step 2: Bench2Drive-220, one seed, commentary and chain-of-thought off (PRD 13, 10.1).
# Done when the driving score is at least 75 from this config, with the Bench2Drive version and
# checkpoint hash recorded. Run by scripts/route_sample.sbatch, one route per array task:
#   bash scripts/submit.sh gpu --time=0-03:00:00 --array=0-219%4 scripts/route_sample.sbatch configs/rollout/step2-bench2drive220.yaml
# The time limit is wide because Bench2Drive's own route timeout (at least 300 simulated seconds)
# must end a stalled route, not Slurm. Routes are in the pinned routes file's order, and this list
# includes all 31 routes of savio-mac-paired.yaml, so it also answers that comparison.

name: step2-bench2drive220
step: 2
scope: savio_step2_bench2drive220

policy:
  name: simlingo
  ckpt_sha256: ec8943723d266ee9f5f56f45d153a163b22616960bfccb741965ea5daa700d28
  cot: false
  device: cuda                   # bfloat16 on CUDA via runtime-compatibility.patch

simulator:
  carla_version: "0.9.15"
  carla_build: stock-linux-release
  bench2drive_version: "0.0.3"
  quality: Epic                  # matches Step 1 and the Mac runs
  timeout_seconds: 60

# Per-layer residual means every step and exact model inputs every 10th step (capture_agent.py),
# as the Mac sweep recorded, so Steps 3-4 can use these rollouts without rerunning them.
capture_every: 10

route:
  seed: 0

measure:
  # Measured 2026-10-08 on A40s (savio3_gpu, gpu_a40 profile), two routes per GPU, bfloat16.
  # Jobs 39732614 (pilot), 39732818 (main), 39732819, 39732860, 39734524 (reruns of routes with
  # no driving outcome). Scored by adapters/simlingo/score_routes.py; evidence in
  # results/savio/step2-bench2drive220/ (summary.json, routes.jsonl, res/merged.json).
  official_driving_score: 88.60    # Bench2Drive merge_route_json.py over all 220; paper CoT off 84.41 +- 1.76
  official_success_rate: 0.727     # paper CoT off 0.648 +- 0.024
  routes_scenario_skipped: 7       # all Interurban(Advanced)ActorFlow; counted by the official merge
  clean_driving_score: 88.63       # the 213 routes whose scenario ran
  clean_success_rate: 0.737
  gpu_hours: 31.0                  # every task, failures and reruns included
  service_units: 910

