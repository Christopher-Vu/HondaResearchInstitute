# Cluster settings. The single place any partition, QoS or GPU type is named.
# Scripts read this; no script hardcodes a partition.
#
# STATUS 2026-10-05: GPU access EXISTS. `sacctmgr show assoc` for imhaohao lists
# ic_cdss170fall on savio3_gpu (a40_gpu3_ica, v100_gpu3_ica, gtx2080_gpu3_ica)
# and savio4_gpu (a5k_gpu4_ica). The 2026-10-01 "rejected" result came from
# submitting with savio_normal, which these partitions do not accept for ic_
# accounts. No GPU job has run yet: scripts/check_gpu.sbatch is the first one.

account: ic_cdss170fall
login_host: hpc.brc.berkeley.edu
users: [christophervu, imhaohao]

gpu:
  # A5000 (24 GB): 26 nodes, 4 CPUs per GPU required. PRD 17.3 expects ~11.4 GB
  # for policy plus server, so 24 GB has headroom.
  # Larger alternative if VRAM is short: savio3_gpu / a40_gpu3_ica / gpu:A40:1
  # with cpus_per_task 8 (48 GB, more SU per hour).
  available: true
  partition: savio4_gpu
  qos: a5k_gpu4_ica
  gres: "gpu:A5000:1"
  cpus_per_task: 4
  # Known-retired, kept so nobody retries it:
  retired: [savio2_gpu]

cpu:
  # CPU partitions for GPU-free work. savio3_htc allocates per core.
  partition: savio3_htc
  qos: savio_normal
  cpus_per_task: 4

carla:
  # null runs CarlaUE4.sh on the GPU node directly, as upstream SimLingo does.
  # If the render stage fails on host Vulkan, pull the official image once on a
  # login node and point this at it; run_savio.py then wraps the server in
  # `apptainer exec --nv`:
  #   APPTAINER_CACHEDIR=$PWD/.runtime/apptainer apptainer pull .runtime/carla-0.9.15.sif docker://carlasim/carla:0.9.15
  container: null

storage:
  # Berkeley Research IT system overview: scratch is not backed up; home is 50 GB.
  # Clone this repository under scratch: its .runtime/ holds ~40 GB of CARLA,
  # weights and the policy venv.
  scratch: /global/scratch/users
  home_quota_gb: 50
  scratch_quota_gb: null
  # PRD §12.1: ~150 GB of activations at the selected layers, recomputed once
  # the hidden size is confirmed.
  activations_estimate_gb: 150

limits:
  max_wall_time: null       # per the allowance, not the general Savio docs
  job_array_width_cap: null
  lowprio_available: false  # not in the sacctmgr association list for ic_cdss170fall

notes: |
  ic_ is an Instructional Computing Allowance: usage is tracked and deducted
  from a pool shared across the program, so experiments are sized deliberately.
  See PRD §17. Savio is approved for unclassified, non-proprietary fundamental
  research only. Login nodes allow at most 2 CPUs and 16 GB per user.
