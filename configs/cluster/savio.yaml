# Cluster settings. The single place any partition, QoS or GPU type is named.
# Scripts read this; no script hardcodes a partition.
#
# STATUS 2026-10-01: GPU access is BLOCKED. Login works (user christophervu),
# but ic_cdss170fall has only savio2_gpu, which is retired, and savio3_gpu /
# savio4_gpu are rejected. A support request is open. Until it is answered,
# nothing GPU-bound can run and no GPU type should be assumed anywhere.

account: ic_cdss170fall
login_host: hpc.brc.berkeley.edu
user: christophervu

gpu:
  # Fill all three from the support reply. Do not guess: a wrong partition
  # produces a confusing rejection rather than a clear error.
  available: false
  partition: null          # e.g. savio3_gpu / savio4_gpu — pending
  qos: null                # savio_normal | savio_debug | savio_lowprio
  gres: null               # e.g. "gpu:1"; the TYPE is deliberately unspecified
  cpus_per_task: 8
  # Known-retired, kept so nobody retries it:
  retired: [savio2_gpu]
  rejected: [savio3_gpu, savio4_gpu]   # as of the 2026-10-01 attempt

cpu:
  # CPU partitions for GPU-free work: config validation, schema checks,
  # scoring dry-runs on synthetic data. Confirm names from savio_recon.sh §2.
  partition: null
  qos: savio_normal
  cpus_per_task: 4

storage:
  # From savio_recon.sh §5 / the support reply.
  scratch: null
  home_quota_gb: null
  scratch_quota_gb: null
  # PRD §12.1: ~150 GB of activations at the selected layers, recomputed once
  # the hidden size is confirmed.
  activations_estimate_gb: 150

limits:
  max_wall_time: null       # per the allowance, not the general Savio docs
  job_array_width_cap: null
  lowprio_available: null   # whether an ic_ allowance may use savio_lowprio

notes: |
  ic_ is an Instructional Computing Allowance: usage is tracked and deducted
  from a pool shared across the program, so experiments are sized deliberately.
  See PRD §17. Savio is approved for unclassified, non-proprietary fundamental
  research only.
