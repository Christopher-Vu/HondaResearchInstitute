        <div data-hf-id="hf-hf9j" class="pile" id="g-pile" data-layout-allow-overflow></div>

        <div data-hf-id="hf-uw8a" class="g-fresh" id="g-fresh-p7" style="left: 988px"></div>

      <div data-hf-id="hf-pkz8" id="g-home">

      </div>

  </div>

  <script>
    (function () {
      const L = window.LIB;
      const D = L.D;
      const M = L.MOVE;
      const cue = (n, phrase) => L.cue("g", n, phrase);
      L.bindNumbers(document);

      const tl = gsap.timeline({ paused: true });
      const ink = L.cssColor("--ink");
      const muted = L.cssColor("--muted");

      /* shot 15: the tuned results, then two fresh piles being driven under rules written first */
      const SIDE = { x: 214, y: 212, scale: 2.6 };
      const pile = L.buildPile(document.getElementById("g-pile"));
      const tiles = pile.tiles;
      gsap.set("#g-pile", { x: SIDE.x, y: SIDE.y, scale: SIDE.scale, transformOrigin: "0 0" });
      pile.roles.crashed.forEach((i) => (tiles[i].style.backgroundColor = ink));
      const found = [...pile.roles.foundP4, ...pile.roles.foundP7].map((i) => {
        const ring = document.createElement("div");
        ring.className = "ring";
        tiles[i].appendChild(ring);
        return ring;
      });

      const buildFresh = (container) => {
        const cells = [];
        for (let i = 0; i < 20 * 10; i++) {
          const cell = document.createElement("div");
          cell.className = "cell";
          cell.style.left = `${(i % 20) * 42}px`;
          cell.style.top = `${Math.floor(i / 20) * 42}px`;
          container.appendChild(cell);
          cells.push(cell);
        }
        return cells;
      };
      const freshP4 = buildFresh(document.getElementById("g-fresh-p4"));
      const freshP7 = buildFresh(document.getElementById("g-fresh-p7"));

      gsap.set(["#g-tuned", "#g-unproven", "#g-fresh-p4", "#g-fresh-p7", "#g-label-p4", "#g-label-p7", "#g-card", "#g-score-p4", "#g-score-p7", "#g-note-p4", "#g-note-p7"], { opacity: 0 });
      gsap.set(["#g-ring-2", "#g-ring-3", "#g-found-2", "#g-found-3", "#g-claim", "#g-f1", "#g-f2", "#g-f3"], { opacity: 0 });

      L.textIn(tl, "#g-tuned", cue(15, "We tuned") + 0.3);
      tl.to(found, { opacity: 1, duration: 0.3, ease: "power2.out", stagger: 0.015 }, cue(15, "We tuned") + 0.5);
      L.textIn(tl, "#g-unproven", cue(15, "not proof"));

      const freshAt = cue(15, "Both faults");
      tl.to(["#g-pile", "#g-tuned", "#g-unproven"], { x: "-=1200", opacity: 0, duration: M.move.duration, ease: M.move.ease }, freshAt - 0.2);
      tl.fromTo("#g-fresh-p4", { opacity: 0 }, { opacity: 1, duration: M.enter.duration, ease: M.enter.ease }, freshAt + 0.3);
      tl.fromTo("#g-fresh-p7", { opacity: 0 }, { opacity: 1, duration: M.enter.duration, ease: M.enter.ease }, freshAt + 0.47);
      L.textIn(tl, "#g-label-p4", freshAt + 0.7);
      L.textIn(tl, "#g-label-p7", freshAt + 0.87);

      const fillStart = cue(15, "fresh roads") - 0.3;
      const fillEnd = cue(15, "first.") + 0.4;
      const fillCount = 60;
      const step = (fillEnd - fillStart) / fillCount;
      [freshP4, freshP7].forEach((cells, lane) => {
        cells.slice(0, fillCount).forEach((cell, i) => {
          tl.to(cell, { backgroundColor: muted, duration: 0.25, ease: "power2.out" }, L.snap(fillStart + i * step + lane * 0.05));
        });
      });

      const ruleAt = cue(15, "rules written");
      tl.fromTo("#g-card", { opacity: 0, clipPath: "inset(0 100% 0 0)" }, { opacity: 1, clipPath: "inset(0 0% 0 0)", duration: M.enter.duration, ease: M.enter.ease }, ruleAt);

      const scoreAt = cue(15, "came back");
      L.textIn(tl, "#g-score-p4", scoreAt + 0.4);
      L.textIn(tl, "#g-note-p4", scoreAt + 0.6);
      L.textIn(tl, "#g-score-p7", scoreAt + 1.4);
      L.textIn(tl, "#g-note-p7", scoreAt + 1.6);

      /* shot 16: the home stage returns; the two crashed drives carry orange "found" marks */
      const homeAt = cue(16, "Reading");
      const markAt = cue(16, "why two");
      tl.to("#g-shot15", { x: -300, opacity: 0, duration: M.exit.duration, ease: M.exit.ease }, homeAt - 0.3);
      ["#g-f1", "#g-f2", "#g-f3"].forEach((frame, i) => {
        tl.fromTo(frame, { opacity: 0, x: 200 }, { opacity: 1, x: 0, duration: M.move.duration, ease: "power3.out" }, homeAt + i * 0.12);
      });
      ["2", "3"].forEach((which, i) => {
        tl.to(`#g-ring-${which}`, { opacity: 1, duration: 0.4, ease: "power2.out" }, markAt + i * 0.17);
        L.textIn(tl, `#g-found-${which}`, markAt + 0.15 + i * 0.17);
      });
      L.textIn(tl, "#g-claim", markAt + 0.6);

      L.seamOut(tl, "#g-stage", 18.22);
      L.seamIn(tl, "#g-stage");
      window.__timelines["scene-g"] = tl;
    })();
  </script>
