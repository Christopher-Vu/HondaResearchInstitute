  <script>
    (function () {
      const L = window.LIB;
      const M = L.MOVE;
      const cue = (n, phrase) => L.cue("a", n, phrase);
      L.bindNumbers(document);

      const tl = gsap.timeline({ paused: true });

      const reelSpec = (extra) => ({ cols: 6, w: 560, h: 280, ...extra });

      /* shot 1: three real drives, 1 PNG per 7.5 video frames */
      L.driveReel(tl, "#a-r1", reelSpec({ at: 0, count: 30 }));
      L.driveReel(tl, "#a-r2a", reelSpec({ at: 0, count: 30 }));
      L.driveReel(tl, "#a-r3a", reelSpec({ at: 0, count: 30 }));

      const namesAt = cue(1, "driven three times");
      ["#a-name1", "#a-name2", "#a-name3"].forEach((name, i) => L.textIn(tl, name, namesAt + i * 0.17));

      const crashedAt = cue(1, "crashed twice");
      ["2", "3"].forEach((which, i) => {
        L.wipeIn(tl, `#a-rule${which}`, crashedAt + i * 0.17);
        L.textIn(tl, `#a-crashed${which}`, crashedAt + 0.15 + i * 0.17);
      });

      /* shot 2: push in on the middle frame, cut to the black patch, pan to the frozen drive */
      const pushAt = cue(2, "Before the second");
      const blackAt = cue(2, "blacked out");
      const panAt = cue(2, "Before the third");
      const clockAt = cue(2, "two seconds");
      const pullAt = cue(3, "We planted") + 0.0;
      const middleCentre = { x: 960, y: 510 };
      const rightCentre = { x: 1544, y: 510 };
      const zoom = 2.4;
      const frameAt = (centre) => ({ x: 960 - zoom * centre.x, y: 540 - zoom * centre.y });

      gsap.set("#a-cam", { transformOrigin: "0 0" });
      tl.to("#a-cam", { ...frameAt(middleCentre), scale: zoom, duration: M.camera.duration, ease: M.camera.ease }, pushAt);
      ["#a-name1", "#a-name2", "#a-name3", "#a-rule2", "#a-rule3", "#a-crashed2", "#a-crashed3"].forEach((label) =>
        tl.to(label, { opacity: 0, duration: M.exit.duration, ease: M.exit.ease }, pushAt)
      );

      /* middle frame: the drive rewinds to its start as full-resolution PNGs; the same frame is cut from clean to black patch */
      gsap.set(["#a-h2-c0", "#a-h3-s0"], { opacity: 1 });
      tl.set("#a-h2", { opacity: 1 }, pushAt);
      tl.set("#a-r2a", { opacity: 0 }, pushAt);
      const blackSteps = [0, 20, 40, 60, 80, 100, 120, 140, 160, 180];
      blackSteps.forEach((step, i) => tl.set(`#a-h2-b${step}`, { opacity: 1 }, L.snap(blackAt + i * 0.25)));

      /* right frame: the pan arrives as it steps, then holds through a repeated pair (000040 = 000060) */
      tl.to("#a-cam", { ...frameAt(rightCentre), scale: zoom, duration: M.camera.duration, ease: M.camera.ease }, panAt);
      tl.set("#a-h3", { opacity: 1 }, panAt);
      tl.set("#a-r3a", { opacity: 0 }, panAt);
      const frozenSteps = [
        [20, panAt + 0.5],
        [40, panAt + 1.0],
        [80, clockAt + 1.3],
        [100, clockAt + 1.65]
      ];
      frozenSteps.forEach(([step, at]) => tl.set(`#a-h3-s${step}`, { opacity: 1 }, L.snap(at)));

      /* the clock: a hand sweeps while the picture is held */
      L.textIn(tl, "#a-clock", clockAt);
      tl.fromTo("#a-clock-hand", { rotation: 0, svgOrigin: "36 36" }, { rotation: 240, duration: 1.3, ease: "none" }, clockAt);
      L.textOut(tl, "#a-clock", clockAt + 1.25);

      /* shot 3: pull back to all three; the crashed ones carry "we did this", then the answer is hidden from the tool */
      tl.to("#a-cam", { x: 0, y: 0, scale: 1, duration: M.camera.duration, ease: M.camera.ease }, pullAt);
      tl.set("#a-h2", { opacity: 0 }, pullAt + 0.05);
      tl.set("#a-h3", { opacity: 0 }, pullAt + 0.05);
      tl.set("#a-r2c", { opacity: 1 }, pullAt + 0.05);
      tl.set("#a-r3c", { opacity: 1 }, pullAt + 0.05);
      L.driveReel(tl, "#a-r1", reelSpec({ at: pullAt + 0.05, count: 30 }));
      L.driveReel(tl, "#a-r2c", reelSpec({ at: pullAt + 0.05, count: 32, rows: 6 }));
      L.driveReel(tl, "#a-r3c", reelSpec({ at: pullAt + 0.05, count: 32, rows: 6 }));

      const labelsBack = pullAt + 0.7;
      ["#a-name1", "#a-name2", "#a-name3"].forEach((name, i) => L.textIn(tl, name, labelsBack + i * 0.17));
      ["2", "3"].forEach((which, i) => {
        L.wipeIn(tl, `#a-rule${which}`, labelsBack + i * 0.17);
        L.textIn(tl, `#a-crashed${which}`, labelsBack + 0.15 + i * 0.17);
      });

      const didAt = cue(3, "on purpose");
      ["2", "3"].forEach((which, i) => L.textIn(tl, `#a-did${which}`, didAt + i * 0.17));
      const hiddenAt = cue(3, "without being told");
      ["2", "3"].forEach((which, i) => L.wipeIn(tl, `#a-redact${which}`, hiddenAt + i * 0.17, 0.5));

      /* initial states */
      gsap.set(["#a-name1", "#a-name2", "#a-name3", "#a-crashed2", "#a-crashed3", "#a-did2", "#a-did3"], { opacity: 0 });
      gsap.set(["#a-rule2", "#a-rule3", "#a-redact2", "#a-redact3"], { clipPath: "inset(0 100% 0 0)" });

      L.seamOut(tl, "#a-stage", 23.02);
      window.__timelines["scene-a"] = tl;
    })();
  </script>
