  <script>
    (function () {
      const L = window.LIB;
      const D = L.D;
      const M = L.MOVE;
      const cue = (n, phrase) => L.cue("f", n, phrase);
      L.bindNumbers(document);

      const tl = gsap.timeline({ paused: true });
      const ink = L.cssColor("--ink");

      const SIDE = { x: 96, y: 351, scale: 1.5 };
      const pile = L.buildPile(document.getElementById("f-pile"));
      const tiles = pile.tiles;
      const roles = pile.roles;
      gsap.set("#f-pile", { x: SIDE.x, y: SIDE.y, scale: SIDE.scale, transformOrigin: "0 0" });
      roles.crashed.forEach((i) => (tiles[i].style.backgroundColor = ink));
      roles.p7.forEach((i) => {
        const mark = document.createElement("div");
        mark.className = "mark";
        tiles[i].appendChild(mark);
      });

      gsap.set(["#f-signal", "#f-sig-a", "#f-sig-b", "#f-count", "#f-score", "#f-score-label", "#f-pane-now", "#f-pane-late", "#f-label-now", "#f-label-late", "#f-equals", "#f-illustrative"], { opacity: 0 });

      /* shot 13: one added signal, "nothing changed", and 48 frozen drives come out with no mistakes */
      const signalAt = cue(13, "We added");
      const methodAt = cue(13, "and a second method");
      const foundAt = methodAt - 0.1;
      const cleanAt = cue(13, "no mistakes");

      tl.fromTo("#f-sig-a", { opacity: 0 }, { opacity: 1, duration: M.enter.duration, ease: M.enter.ease }, signalAt + 0.3);
      tl.fromTo("#f-sig-b", { opacity: 0 }, { opacity: 1, duration: M.enter.duration, ease: M.enter.ease }, signalAt + 0.47);
      L.textIn(tl, "#f-signal", cue(13, "nothing changed"));
      tl.to(["#f-signal", "#f-sig-a", "#f-sig-b"], { opacity: 0, duration: M.exit.duration, ease: M.exit.ease }, methodAt - 0.3);

      const foundTiles = roles.foundP7.map((i) => tiles[i]);
      const rings = foundTiles.map((tile) => {
        const ring = document.createElement("div");
        ring.className = "ring";
        tile.appendChild(ring);
        return ring;
      });
      tl.to(rings, { opacity: 1, duration: 0.25, ease: "power2.out", stagger: 0.004 }, foundAt);

      const group = { x: 986, y: 190, size: 96, gap: 10, perRow: 8, stagger: 0.006, duration: 0.8 };
      L.slideToGroup(tl, pile, roles.foundP7, SIDE, group, foundAt + 0.35, {});
      L.textIn(tl, "#f-count", foundAt + 1.4);
      const score = { value: 0 };
      const scoreEl = document.getElementById("f-score");
      L.textIn(tl, "#f-score", cleanAt - 0.2);
      tl.to(
        score,
        { value: D.p7.jaccard, duration: 0.8, ease: "power2.out", onUpdate: () => (scoreEl.textContent = score.value.toFixed(2)) },
        cleanAt - 0.2
      );
      L.textIn(tl, "#f-score-label", cleanAt + 0.3);

      /* shot 14: a one-second delay stays hidden; the cars it breaks are parked, so late looks the same as now */
      const delayAt = cue(14, "A one-second");
      const parkedAt = cue(14, "The cars it breaks");
      const equalAt = cue(14, "parked car cannot");

      const groupTiles = roles.foundP7.map((i) => tiles[i]);
      tl.to(groupTiles, { opacity: 0, x: "-=160", duration: M.exit.duration, ease: M.exit.ease, stagger: 0.004 }, delayAt + 0.1);
      tl.to(["#f-notes"], { opacity: 0, duration: M.exit.duration, ease: M.exit.ease }, delayAt + 0.1);

      const delayedTile = roles.p8[0];
      const solo = { x: 1180, y: 380, size: 240, gap: 0, perRow: 1 };
      L.slideToGroup(tl, pile, [delayedTile], SIDE, solo, cue(14, "still hidden") - 0.2, {});
      const restOfPile = tiles.filter((_, i) => i !== delayedTile && !roles.foundP7.includes(i));
      tl.to(restOfPile, { opacity: 0, duration: M.exit.duration, ease: M.exit.ease }, parkedAt - 0.3);
      tl.to(tiles[delayedTile], { opacity: 0, duration: 0.3, ease: M.exit.ease }, parkedAt);
      tl.fromTo("#f-pane-now", { opacity: 0 }, { opacity: 1, duration: M.enter.duration, ease: M.enter.ease }, parkedAt);
      tl.fromTo("#f-pane-late", { opacity: 0 }, { opacity: 1, duration: M.enter.duration, ease: M.enter.ease }, parkedAt + 0.17);
      L.textIn(tl, "#f-label-now", parkedAt + 0.4);
      L.textIn(tl, "#f-label-late", parkedAt + 0.57);
      L.textIn(tl, "#f-equals", equalAt);
      L.textIn(tl, "#f-illustrative", equalAt + 0.3);

      L.seamOut(tl, "#f-stage", 15.81);
      L.seamIn(tl, "#f-stage");
      window.__timelines["scene-f"] = tl;
    })();
