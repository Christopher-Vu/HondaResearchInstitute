    <style>
      @font-face {
        font-family: "Archivo";
        src: url("assets/fonts/Archivo-latin.woff2") format("woff2");
        font-weight: 100 900;
        font-stretch: 62% 125%;
        font-display: block;
      }

      :root {
        --ground: #d8d8d4;
        --ink: #1b1c1e;
        --accent: #ff5a1f;
        --muted: #6b6e72;
        --hairline: 2px;
        --frame-shadow: 0 12px 32px rgba(0, 0, 0, 0.18);
        --shade: rgba(27, 28, 30, 0.12);
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--ground);
      }

      body {
        font-family: "Archivo", sans-serif;
        color: var(--ink);
      }

      #ground {
        position: absolute;
        inset: 0;
        background: var(--ground);
      }

      #grain {
        position: absolute;
        inset: 0;
        background-image: url("assets/grain.png");
        background-size: 256px 256px;
        opacity: 0.03;
        pointer-events: none;
        z-index: 50;
      }

      .display {
        font-weight: 800;
        font-stretch: 112%;
        font-size: 96px;
        line-height: 1;
        font-variant-numeric: tabular-nums;
      }
      .display-xl { font-size: 220px; }
      .display-lg { font-size: 120px; }
      .body {
        font-weight: 500;
        font-stretch: 100%;
        font-size: 44px;
        line-height: 1.18;
        font-variant-numeric: tabular-nums;
      }
      .link {
        font-weight: 700;
        font-stretch: 100%;
        font-size: 56px;
        line-height: 1.18;
      }
      .small {
        font-weight: 500;
        font-stretch: 100%;
        font-size: 32px;
        line-height: 1.2;
      }
      .ink { color: var(--ink); }
      .muted { color: var(--muted); }
      .accent { color: var(--accent); }

      /* a real camera frame: square corners, 1 px ink edge, soft contact shadow */
      .shot {
        position: absolute;
        width: 560px;
        height: 280px;
        border: 1px solid var(--ink);
        box-shadow: var(--frame-shadow);
        background: var(--ink);
        overflow: hidden;
      }
      .reel,
      .still {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        background-repeat: no-repeat;
      }
      .still { object-fit: cover; }

      .rule {
        position: absolute;
        height: var(--hairline);
        background: var(--ink);
      }

      .tile {
        position: absolute;
        width: 12px;
        height: 12px;
        box-shadow: inset 0 0 0 1px var(--ink);
      }
      .tile .ring {
        position: absolute;
        inset: -1.5px;
        border: 1.5px solid var(--accent);
        opacity: 0;
      }
      .sq {
        position: absolute;
        width: 40px;
        height: 40px;
        box-shadow: inset 0 0 0 2px var(--ink);
      }
      .tile .patch {
        position: absolute;
        inset: 0;
        background-size: cover;
        background-position: center;
        opacity: 0;
      }
    </style>
