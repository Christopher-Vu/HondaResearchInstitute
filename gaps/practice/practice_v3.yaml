# Interactional practice gaps (PRD 9.1: the main claim is about these). Every interactional gap so far, P5 and P6,
# met SimLingo starting from rest or in appearance only, and failed its screen (docs/WHAT_BROKE.md, 2026-10-14 and
# 2026-10-15). These change the interaction itself and meet the car at speed.
# Public, like versions 1 and 2: every predicate here is excluded from the sealed pool.
# docs/research/experiments/h5-interactional-screen/protocol.md fixes the screen and its reading.

version: 3

gaps:
  - gap_id: P10_late_fast_crossing
    tier: T2_interactional
    summary: >-
      A pedestrian runs from behind a blocker at 3.5 m/s, starting when the car is 1.4 s from the crossing point.
      Bench2Drive's DynamicObjectCrossing always walks at 2 m/s and starts at 2.1 s. The trigger sits 50 m along the
      route so the car is at speed. The neighbourhood is the same crossing at stock timing, so the pair differs only
      in how late and how fast the walker comes. At 1.4 s a car at 9 m/s has 12.6 m, enough to stop by simple
      arithmetic (not checked with an expert driver).
    predicate:
      - {field: injected_parameters.reaction_time, op: "==", value: 1.4}
    plant:
      base_routes: 60
      min_route_length_m: 130
      weather: {preset: ClearNoon}
      scenario:
        type: DynamicObjectCrossing
        trigger_after_m: 50
        parameters: {distance: 20, direction: right, reaction_time: 1.4, adversary_speed: 3.5}
    neighbourhood:
      weather: {preset: ClearNoon}
      scenario:
        type: DynamicObjectCrossing
        trigger_after_m: 50
        parameters: {distance: 20, direction: right, reaction_time: 2.1, adversary_speed: 2.0}
    # C24, fixed before the screen runs: the logged nearest-pedestrian distance falls below 15 m with the car above
    # 4 m/s in at least 4 of the first 5 scored slice routes.
    manipulation_check: {measure: min_pedestrian_distance_m, max_value: 15, min_ego_speed: 4, min_routes_passing: 4, of_routes: 5}
    screen_rule: {min_excess_slice_only_failures: 3, of_pairs: 10}

  - gap_id: P13_later_fast_crossing
    tier: T2_interactional
    summary: >-
      P10 with the walker starting later: 3.5 m/s, starting when the car is 1.2 s from the crossing point. The neighbourhood is
      the same stock crossing as P10's. SimLingo's measured stops from 10 to 12 m/s take 7 to 8 m, so at 1.2 s a car at 11 m/s has
      about 0.3 s to respond, and at 1.0 s it has about 0.1 s (arithmetic on measured stops; not checked with an expert driver).
    predicate:
      - {field: injected_parameters.reaction_time, op: "==", value: 1.2}
    plant:
      base_routes: 60
      min_route_length_m: 130
      weather: {preset: ClearNoon}
      scenario:
        type: DynamicObjectCrossing
        trigger_after_m: 50
        parameters: {distance: 20, direction: right, reaction_time: 1.2, adversary_speed: 3.5}
    neighbourhood:
      weather: {preset: ClearNoon}
      scenario:
        type: DynamicObjectCrossing
        trigger_after_m: 50
        parameters: {distance: 20, direction: right, reaction_time: 2.1, adversary_speed: 2.0}
    # C24, fixed before the screen runs and read before any outcome: the car passes within 5 m of the scenario's trigger point
    # above 4 m/s in at least 70% of scored slice routes. The trigger sits 20 m before the crossing and the walker has not been
    # placed yet, so this cannot depend on how the car reacts to the walker (WHAT_BROKE.md, 2026-11-01).
    manipulation_check: {measure: ego_speed_at_trigger_point, max_miss_m: 5, min_ego_speed: 4, min_fraction_passing: 0.7, of_routes: scored_slices}
    screen_rule: {min_excess_slice_only_failures: 3, of_pairs: 10}

  - gap_id: P14_fast_flow_join
    tier: T2_interactional
    summary: >-
      A sub-range of a known family: the car joins a stream of traffic moving at 15 m/s (right turns and merges). The neighbourhood is
      the same base route with the stream at 7 m/s. On Bench2Drive's own routes, signalized right turns failed 8 of 8 at 13 to 14 m/s and 0 of 5
      at 10 to 12 m/s (dev data, 5 base routes, exploratory). Solvability is not checked with an expert driver.
    predicate:
      - {field: base_scenario_parameters.flow_speed, op: "==", value: 15}
    plant:
      base_routes: 10
      include_scenarios: [SignalizedJunctionRightTurn, NonSignalizedJunctionRightTurn, EnterActorFlow, MergerIntoSlowTrafficV2]
      weather: {preset: ClearNoon}
      base_scenario_parameters: {flow_speed: 15}
    neighbourhood:
      weather: {preset: ClearNoon}
      base_scenario_parameters: {flow_speed: 7}
    # C24, fixed before the screen runs: the car passes within 5 m of the scenario's trigger point in at least 70% of scored
    # slice routes, with another vehicle within 50 m in the 10 s after. Reaching the trigger comes before the traffic matters.
    manipulation_check: {measure: reached_trigger_with_traffic, max_miss_m: 5, within_s: 10, min_fraction_passing: 0.7, of_routes: scored_slices}
    screen_rule: {min_excess_slice_only_failures: 3, of_pairs: 10}

  - gap_id: P15_fast_flow_left_turn
    tier: T2_interactional
    summary: >-
      A sub-range of a known family: the car turns left across a stream moving at 15 m/s. The neighbourhood is the same base route with
      the stream at 7 m/s. These families already fail about half the time at 8 to 11 m/s (dev data), so the slower stream may lower
      the neighbourhood's rate. Solvability is not checked with an expert driver.
    predicate:
      - {field: base_scenario_parameters.flow_speed, op: "==", value: 15}
    plant:
      base_routes: 10
      include_scenarios: [SignalizedJunctionLeftTurn, NonSignalizedJunctionLeftTurn, SignalizedJunctionLeftTurnEnterFlow, NonSignalizedJunctionLeftTurnEnterFlow]
      weather: {preset: ClearNoon}
      base_scenario_parameters: {flow_speed: 15}
    neighbourhood:
      weather: {preset: ClearNoon}
      base_scenario_parameters: {flow_speed: 7}
    # C24, fixed before the screen runs: the car passes within 5 m of the scenario's trigger point in at least 70% of scored
    # slice routes, with another vehicle within 50 m in the 10 s after. Reaching the trigger comes before the traffic matters.
    manipulation_check: {measure: reached_trigger_with_traffic, max_miss_m: 5, within_s: 10, min_fraction_passing: 0.7, of_routes: scored_slices}
    screen_rule: {min_excess_slice_only_failures: 3, of_pairs: 10}

  - gap_id: P16_dense_oncoming_overtake
    tier: T2_interactional
    summary: >-
      A sub-range of a known family: the car must leave its lane around an obstacle while oncoming vehicles come every 30 to 45 m. The
      neighbourhood is the same base route with gaps of 120 to 200 m. Bench2Drive's routes draw these gaps from about 30 to 200 m. Solvability is not
      checked with an expert driver, and short gaps may make a car wait until a timeout.
    predicate:
      - {field: base_scenario_parameters.frequency, op: "==", value: {from: 30, to: 45}}
    plant:
      base_routes: 10
      include_scenarios: [ConstructionObstacleTwoWays, ParkedObstacleTwoWays, AccidentTwoWays, VehicleOpensDoorTwoWays]
      weather: {preset: ClearNoon}
      base_scenario_parameters: {frequency: {from: 30, to: 45}}
    neighbourhood:
      weather: {preset: ClearNoon}
      base_scenario_parameters: {frequency: {from: 120, to: 200}}
    # C24, fixed before the screen runs: the car passes within 5 m of the scenario's trigger point in at least 70% of scored
    # slice routes, with another vehicle within 50 m in the 10 s after. Reaching the trigger comes before the traffic matters.
    manipulation_check: {measure: reached_trigger_with_traffic, max_miss_m: 5, within_s: 10, min_fraction_passing: 0.7, of_routes: scored_slices}
    screen_rule: {min_excess_slice_only_failures: 3, of_pairs: 10}

  - gap_id: P17_late_static_cut_in
    tier: T2_interactional
    summary: >-
      A sub-range of a known family: a parked vehicle cuts in when the car is 1.6 s away, or 10 m at low speed. Bench2Drive's StaticCutIn starts at 2.7 s or 15 m, which is the neighbourhood. SimLingo's measured stops from 10 to 12 m/s take 7 to 8 m, so at 11 m/s it has about 0.7 s to respond (arithmetic; the expert check comes after any pass). Needs adapters/simlingo/patches/cut-in-timing.patch.
    predicate:
      - {field: added_scenario_parameters.reaction_time, op: "==", value: 1.6}
    plant:
      base_routes: 0
      include_scenarios: [StaticCutIn]
      weather: {preset: ClearNoon}
      added_scenario_parameters: {reaction_time: 1.6, min_trigger_dist: 10}
    neighbourhood:
      weather: {preset: ClearNoon}
      added_scenario_parameters: {reaction_time: 2.7, min_trigger_dist: 15}
    # C24, fixed before the screen runs: the car passes within 5 m of the scenario's trigger point in at least 70% of scored
    # slice routes, with another vehicle within 50 m in the 10 s after.
    manipulation_check: {measure: reached_trigger_with_traffic, max_miss_m: 5, within_s: 10, min_fraction_passing: 0.7, of_routes: scored_slices}
    screen_rule: {min_excess_slice_only_failures: 3, of_pairs: 10}

  - gap_id: P18_close_emergency_vehicle
    tier: T1_enumerable
    summary: >-
      An enumerable family, not a conjunction: an emergency vehicle starts 25 m behind and the car must make way. In the neighbourhood it starts 140 m behind, the scenario's own default, on the same road. Unplanted, this family failed 12 of 13 at 26 to 30 m. This fills PRD 9.1's enumerable slot and does not count toward the two interactional gaps.
    predicate:
      - {field: base_scenario_parameters.distance, op: "==", value: 25}
    plant:
      base_routes: 0
      include_scenarios: [YieldToEmergencyVehicle]
      weather: {preset: ClearNoon}
      base_scenario_parameters: {distance: 25}
    neighbourhood:
      weather: {preset: ClearNoon}
      base_scenario_parameters: {distance: 140}
    # C24, fixed before the screen runs: the car passes within 5 m of the scenario's trigger point in at least 70% of scored
    # slice routes, with another vehicle within 50 m in the 10 s after.
    manipulation_check: {measure: reached_trigger_with_traffic, max_miss_m: 5, within_s: 10, min_fraction_passing: 0.7, of_routes: scored_slices}
    screen_rule: {min_excess_slice_only_failures: 3, of_pairs: 10}

  - gap_id: P19_wide_invading_turn
    tier: T2_interactional
    summary: >-
      A region outside the collection range: oncoming traffic on a bend comes 1.2 m into the car's half of the road, so the car must move over while passing it.
      Bench2Drive's routes and the leaderboard's use 0.15 to 0.6 m. The neighbourhood is the same road at 0.2 m. Unplanted, InvadingTurn failed 1 of 12. PRD 9.1 names this family as a candidate.
    predicate:
      - {field: base_scenario_parameters.offset, op: "==", value: 1.2}
    plant:
      base_routes: 0
      include_scenarios: [InvadingTurn]
      weather: {preset: ClearNoon}
      base_scenario_parameters: {offset: 1.2}
    neighbourhood:
      weather: {preset: ClearNoon}
      base_scenario_parameters: {offset: 0.2}
    # C24, fixed before the screen runs: the car passes within 5 m of the scenario's trigger point in at least 70% of scored
    # slice routes, with another vehicle within 50 m in the 10 s after.
    manipulation_check: {measure: reached_trigger_with_traffic, max_miss_m: 5, within_s: 10, min_fraction_passing: 0.7, of_routes: scored_slices}
    screen_rule: {min_excess_slice_only_failures: 3, of_pairs: 10}

  - gap_id: P20_oncoming_hidden
    tier: T2_interactional
    summary: >-
      A conjunction across five families: the left of the camera is blacked out on a road where the car meets vehicles coming the other way.
      The neighbourhood is the same road with the mirror-image patch on the right, so oncoming traffic stays visible. Both arms carry a patch
      of one size, so only whether it hides the traffic differs. Spread over families because a single-family gap cannot pass PRD 13 Step 5
      (docs/research/experiments/h13-cross-family-gap/protocol.md).
    predicate:
      - {field: sensor.camera_fault.box, op: "==", value: [0.0, 0.25, 0.45, 0.65]}
    plant:
      base_routes: 40
      include_scenarios: [AccidentTwoWays, ParkedObstacleTwoWays, HazardAtSideLaneTwoWays, VehicleOpensDoorTwoWays, InvadingTurn]
      even_families: true
      weather: {draw: background}
      sensor:
        camera_fault: {kind: occlusion, box: [0.0, 0.25, 0.45, 0.65]}
    neighbourhood:
      weather: {draw: background}
      sensor:
        camera_fault: {kind: occlusion, box: [0.55, 0.25, 1.0, 0.65]}
    # C24, fixed before the screen runs: at least 99% of the box is black in the saved frames of the first 5 scored slice routes, and the car
    # passes within 5 m of the scenario's trigger with another vehicle within 50 m in the 10 s after, on at least 70% of scored slice routes.
    manipulation_check: {measure: black_box_and_reached_trigger_with_traffic, min_fraction: 0.99, of_first_routes: 5, max_miss_m: 5, within_s: 10, min_fraction_passing: 0.7, of_routes: scored_slices}
    # min_pairs, H13's amendment of 2026-11-04: fewer scored pairs is no result, not a failed screen.
    screen_rule: {min_excess_slice_only_failures: 3, of_pairs: 10, min_pairs: 8}

  - gap_id: P11_blind_side_crossing
    tier: T2_interactional
    summary: >-
      A conjunction: the right side of the camera is blacked out and a pedestrian crosses from the right. In the
      neighbourhood the same crossing runs with the mirror-image patch on the left, so the walker stays visible. Both
      arms carry a patch of the same size and the same stock crossing; only whether the hazard falls in the blind area
      differs. The patch reaches from 55% of the width because a walker at the kerb 15 m ahead sits near 60% of the
      width (fov 110, by arithmetic).
    predicate:
      - {field: sensor.camera_fault.box, op: "==", value: [0.55, 0.25, 1.0, 0.65]}
    plant:
      base_routes: 60
      min_route_length_m: 130
      weather: {preset: ClearNoon}
      sensor:
        camera_fault: {kind: occlusion, box: [0.55, 0.25, 1.0, 0.65]}
      scenario:
        type: DynamicObjectCrossing
        trigger_after_m: 50
        parameters: {distance: 20, direction: right}
    neighbourhood:
      weather: {preset: ClearNoon}
      sensor:
        camera_fault: {kind: occlusion, box: [0.0, 0.25, 0.45, 0.65]}
      scenario:
        type: DynamicObjectCrossing
        trigger_after_m: 50
        parameters: {distance: 20, direction: right}
    # C24, fixed before the screen runs: at least 99% of the box's pixels are black in the saved frames of the first
    # 5 scored slice routes, and the nearest-pedestrian distance falls below 15 m in at least 4 of them.
    manipulation_check: {measure: black_fraction_in_box, min_fraction: 0.99, max_pedestrian_distance_m: 15, min_routes_passing: 4, of_routes: 5}
    screen_rule: {min_excess_slice_only_failures: 3, of_pairs: 10}

  - gap_id: P12_walkers_at_speed
    tier: T2_interactional
    summary: >-
      P5 with Fail2Drive's own distance: three pedestrians walking along the ego lane 60 m ahead, not 30 m. Fail2Drive
      reports SimLingo colliding in 87% of its PedestriansOnRoad routes, and P5 measured 2 of 8 with the car meeting
      them slowly (docs/WHAT_BROKE.md, 2026-10-14). This tests whether speed explains that difference.
    predicate:
      - {field: injected, op: "==", value: PedestriansOnRoad}
    plant:
      base_routes: 60
      min_route_length_m: 130
      weather: {preset: ClearNoon}
      scenario:
        type: PedestriansOnRoad
        parameters: {distance: 60, walker_duration: 20, walker_speed: 2}
        attributes:
          pedestrians: {a: walker.pedestrian.0034, b: walker.pedestrian.0007, c: walker.pedestrian.0015}
    neighbourhood:
      weather: {preset: ClearNoon}
    # C24, fixed before the screen runs: the nearest-pedestrian distance falls below 15 m with the car above 4 m/s in
    # at least 4 of the first 5 scored slice routes.
    manipulation_check: {measure: min_pedestrian_distance_m, max_value: 15, min_ego_speed: 4, min_routes_passing: 4, of_routes: 5}
    screen_rule: {min_excess_slice_only_failures: 3, of_pairs: 10}
